<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>웨딩 비디오북</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8;
    --gold: #C9A96E;
    --gold-light: #E8D5A3;
    --dark: #1A1510;
    --warm-gray: #8B7D6B;
    --rose: #C4877A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Noto Serif KR', serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 100;
  }

  .screen {
    display: none;
    width: 100vw;
    height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    position: relative;
    animation: fadeIn 0.6s ease;
  }

  .screen.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Decorative line */
  .ornament {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 16px 0;
    width: 100%;
    max-width: 320px;
  }

  .ornament::before,
  .ornament::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .ornament span {
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold);
    font-size: 18px;
  }

  /* Typography */
  .display {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(36px, 8vw, 56px);
    color: var(--gold-light);
    line-height: 1.1;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .subtitle {
    font-family: 'Noto Serif KR', serif;
    font-weight: 300;
    font-size: 13px;
    color: var(--warm-gray);
    text-align: center;
    letter-spacing: 0.2em;
    line-height: 1.8;
  }

  .label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* Buttons */
  .btn-primary {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    padding: 16px 48px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: -1;
  }

  .btn-primary:hover::before { transform: translateX(0); }
  .btn-primary:hover { color: var(--dark); }
  .btn-primary:active { opacity: 0.8; }

  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--warm-gray);
    font-family: 'Noto Serif KR', serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 12px 24px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* Input */
  input[type="text"] {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--gold);
    color: var(--cream);
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 300;
    text-align: center;
    padding: 12px 0;
    width: 100%;
    max-width: 280px;
    outline: none;
    letter-spacing: 0.1em;
    transition: border-color 0.3s;
  }

  input[type="text"]:focus { border-color: var(--gold-light); }
  input[type="text"]::placeholder { color: var(--warm-gray); font-size: 16px; }

  /* Timer choice */
  .timer-options {
    display: flex;
    gap: 20px;
    margin-top: 8px;
  }

  .timer-btn {
    background: transparent;
    border: 1px solid var(--warm-gray);
    color: var(--warm-gray);
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 300;
    padding: 24px 36px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .timer-btn span {
    font-family: 'Noto Serif KR', serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--warm-gray);
  }

  .timer-btn:hover, .timer-btn.selected {
    border-color: var(--gold);
    color: var(--gold-light);
  }

  .timer-btn.selected span { color: var(--gold); }

  /* Camera / Preview */
  #camera-container {
    position: relative;
    width: min(600px, 92vw);
    height: min(480px, 70vw);
    overflow: hidden;
    border: 1px solid rgba(201,169,110,0.3);
  }

  #preview-video, #record-video, #result-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    background: #000;
  }

  /* Big countdown */
  .big-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 96px;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
    text-align: center;
  }

  /* Recording timer bar */
  .timer-bar-wrap {
    width: min(340px, 90vw);
    height: 2px;
    background: rgba(255,255,255,0.1);
    margin-top: 16px;
  }

  .timer-bar {
    height: 100%;
    background: var(--gold);
    transition: width 1s linear;
  }

  /* Recording dot */
  .rec-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--rose);
  }

  .rec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--rose);
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Complete screen */
  .complete-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-style: italic;
    color: var(--gold-light);
    text-align: center;
    margin: 8px 0;
  }

  .couple-names {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--warm-gray);
    text-align: center;
  }

  /* QR placeholder */
  .qr-box {
    width: 120px;
    height: 120px;
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--warm-gray);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-align: center;
    padding: 12px;
  }

  /* Stack layout */
  .gap-8 { gap: 8px; display: flex; flex-direction: column; align-items: center; }
  .gap-16 { gap: 16px; display: flex; flex-direction: column; align-items: center; }
  .gap-24 { gap: 24px; display: flex; flex-direction: column; align-items: center; }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }

  /* Corner decoration */
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border-color: rgba(201,169,110,0.3);
    border-style: solid;
  }
  .corner-tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
  .corner-tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
  .corner-bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
  .corner-br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }
</style>
</head>
<body>

<!-- SCREEN 1: Main -->
<div class="screen active" id="screen-main">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="gap-16">
    <p class="subtitle">2026 · 05 · 23</p>
    <div class="display">이형희 & 장수용</div>
    <div class="ornament"><span>♡</span></div>
    <p class="subtitle">소중한 축하 한마디를<br>영상으로 남겨주세요</p>
    <button class="btn-primary mt-24" onclick="goTo('screen-name')">시작하기</button>
  </div>
</div>

<!-- SCREEN 2: Name Input -->
<div class="screen" id="screen-name">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="gap-24" style="width:100%">
    <div class="gap-8">
      <p class="label">Step 1</p>
      <p class="display" style="font-size:32px">성함을 입력해주세요</p>
    </div>
    <div class="ornament"><span>✦</span></div>
    <input type="text" id="name-input" placeholder="홍길동" maxlength="10" />
    <button class="btn-primary mt-16" onclick="submitName()">다음</button>
  </div>
</div>

<!-- SCREEN 3: Timer Select -->
<div class="screen" id="screen-timer">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="gap-24">
    <div class="gap-8">
      <p class="label">Step 2</p>
      <p class="display" style="font-size:32px">촬영 시간 선택</p>
    </div>
    <div class="ornament"><span>✦</span></div>
    <div class="timer-options">
      <button class="timer-btn" id="t15" onclick="selectTimer(10)">
        10<span>초</span>
      </button>
      <button class="timer-btn" id="t30" onclick="selectTimer(15)">
        15<span>초</span>
      </button>
    </div>
    <button class="btn-primary mt-8" id="timer-next-btn" onclick="goToPreview()" style="opacity:0.3;pointer-events:none">다음</button>
  </div>
</div>

<!-- SCREEN 4: Preview (5sec countdown) -->
<div class="screen" id="screen-preview">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="gap-16" style="width:100%">
    <p class="label" style="text-align:center">준비되셨나요?</p>
    <div id="camera-container">
      <video id="preview-video" autoplay muted playsinline></video>
    </div>
    <div class="big-count" id="preview-count">5</div>
    <p class="subtitle">잠시 후 자동으로 녹화가 시작됩니다</p>
  </div>
</div>

<!-- SCREEN 5: Recording -->
<div class="screen" id="screen-recording">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="gap-16" style="width:100%; align-items:center">
    <div class="rec-indicator">
      <div class="rec-dot"></div>
      <span>REC</span>
    </div>
    <div id="camera-container">
      <video id="record-video" autoplay muted playsinline></video>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar" style="width:100%"></div>
    </div>
    <div class="big-count" style="font-size:64px" id="record-count">--</div>
    <p class="subtitle" id="record-name-label"></p>
  </div>
</div>

<!-- SCREEN 6: Result -->
<div class="screen" id="screen-result">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="gap-16" style="width:100%; align-items:center">
    <p class="label">미리보기</p>
    <div id="camera-container">
      <video id="result-video" controls playsinline></video>
    </div>
    <div style="display:flex; gap:16px; margin-top:16px">
      <button class="btn-ghost" onclick="retake()">다시 촬영</button>
      <button class="btn-primary" onclick="submit()">제출하기</button>
    </div>
  </div>
</div>

<!-- SCREEN 7: Complete -->
<div class="screen" id="screen-complete">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="gap-16" style="align-items:center">
    <div class="gap-8">
      <p class="subtitle">영상이 저장되었습니다</p>
      <div class="complete-name" id="complete-name"></div>
      <p class="couple-names">이형희 · 장수용님께 소중한 영상을 전달해드리겠습니다<br>축하해주셔서 감사합니다 💌</p>
    </div>
    <div class="ornament"><span>♡</span></div>
    <!-- <div class="qr-box">
      <span>QR 코드<br>준비 중</span>
    </div> -->
    <a id="download-link" class="btn-primary mt-8" download="wedding-video.webm">영상 저장하기</a>
    <button class="btn-ghost" onclick="restart()">처음으로 돌아가기</button>
  </div>
</div>

<script>
  // State
  let guestName = '';
  let selectedTimer = 0;
  let stream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let previewInterval = null;
  let recordInterval = null;

  // Navigation
  function goTo(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // Name
  function submitName() {
    const val = document.getElementById('name-input').value.trim();
    if (!val) { alert('성함을 입력해주세요'); return; }
    guestName = val;
    goTo('screen-timer');
  }

  // Timer
  function selectTimer(sec) {
    selectedTimer = sec;
    document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('t' + sec).classList.add('selected');
    const btn = document.getElementById('timer-next-btn');
    btn.style.opacity = '1';
    btn.style.pointerEvents = 'auto';
  }

  // Preview
  async function goToPreview() {
    goTo('screen-preview');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
      document.getElementById('preview-video').srcObject = stream;
    } catch(e) {
      alert('카메라 접근 권한이 필요합니다');
      goTo('screen-timer');
      return;
    }

    let count = 5;
    document.getElementById('preview-count').textContent = count;
    previewInterval = setInterval(() => {
      count--;
      document.getElementById('preview-count').textContent = count;
      if (count <= 0) {
        clearInterval(previewInterval);
        startRecording();
      }
    }, 1000);
  }

  // Recording
  function startRecording() {
    goTo('screen-recording');

    const recordVideo = document.getElementById('record-video');
    recordVideo.srcObject = stream;
    document.getElementById('record-name-label').textContent = guestName + ' 님, 촬영 중입니다';

    // 지원 mimeType 자동 감지 (아이패드 대응)
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
      ? 'video/webm;codecs=vp8'
      : MediaRecorder.isTypeSupported('video/webm')
      ? 'video/webm'
      : MediaRecorder.isTypeSupported('video/mp4')
      ? 'video/mp4'
      : '';

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = showResult;

    function beginTimer() {
      mediaRecorder.start();
      let elapsed = 0;
      const total = selectedTimer;
      document.getElementById('record-count').textContent = total;
      document.getElementById('timer-bar').style.width = '100%';

      recordInterval = setInterval(() => {
        elapsed++;
        const remaining = total - elapsed;
        document.getElementById('record-count').textContent = remaining;
        document.getElementById('timer-bar').style.width = ((remaining / total) * 100) + '%';
        if (remaining <= 0) {
          clearInterval(recordInterval);
          mediaRecorder.stop();
        }
      }, 1000);
    }

    // stream 연결 후 play 확인하고 녹화 시작
    if (recordVideo.readyState >= 2) {
      recordVideo.play();
      beginTimer();
    } else {
      recordVideo.onloadedmetadata = () => {
        recordVideo.play();
        beginTimer();
      };
    }
  }

  // Result
  function showResult() {
    // 녹화된 실제 mimeType으로 blob 생성
    const recordedMime = mediaRecorder.mimeType || 'video/webm';
    const blob = new Blob(recordedChunks, { type: recordedMime });
    const url = URL.createObjectURL(blob);

    window._recordedBlob = blob;
    window._recordedUrl = url;
    window._recordedMime = recordedMime;

    goTo('screen-result');

    const resultVideo = document.getElementById('result-video');
    resultVideo.srcObject = null;
    resultVideo.src = url;
    resultVideo.muted = false;

    resultVideo.onloadedmetadata = () => {
      resultVideo.play().catch(() => {});
    };

    // 아이패드 대비 약간의 딜레이 후 재시도
    setTimeout(() => {
      if (resultVideo.paused) {
        resultVideo.load();
        resultVideo.play().catch(() => {});
      }
    }, 500);
  }

  // Retake
  function retake() {
    recordedChunks = [];
    goToPreview();
  }

  // Submit
  function submit() {
    document.getElementById('complete-name').textContent = guestName + ' 님';
    const ext = (window._recordedMime || '').includes('mp4') ? 'mp4' : 'webm';
    const link = document.getElementById('download-link');
    link.href = window._recordedUrl;
    link.download = guestName + '_웨딩영상.' + ext;
    goTo('screen-complete');
    stopStream();
  }

  // Restart
  function restart() {
    guestName = '';
    selectedTimer = 0;
    recordedChunks = [];
    document.getElementById('name-input').value = '';
    document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('selected'));
    const btn = document.getElementById('timer-next-btn');
    btn.style.opacity = '0.3';
    btn.style.pointerEvents = 'none';
    stopStream();
    goTo('screen-main');
  }

  function stopStream() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  // Enter key for name
  document.getElementById('name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitName();
  });
</script>
</body>
</html>
